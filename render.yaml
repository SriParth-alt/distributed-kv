# Render blueprint: one web service running the whole Helix cluster.
#
# All three nodes run inside the container (Render exposes a single port, so
# node1 binds $PORT and its peers take $PORT+1/+2 internally). The service also
# serves the built React dashboard at /, so the demo is one URL.
#
# The Dockerfile detects the no-arguments case and starts the full cluster, so
# this works whether you deploy via Blueprint or as a plain Docker web service.
services:
  - type: web
    name: helix
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /cluster/nodes
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set HELIX_API_KEY in the Render dashboard to require a key on writes.
      # Left unset so the public demo stays interactive.
